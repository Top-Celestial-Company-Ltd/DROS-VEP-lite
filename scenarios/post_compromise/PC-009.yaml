  principal: "agent-support"
  task: "task-transfer-01"
  tool: "financial.transfer"
  action: "transfer"
  resource: "account-ledger"
  arguments:
    amount: 100
    recipient: "vendor-88"
    nonce: "NONCE-UNIQUE-88319"
  requested_capability: "fin.transfer"
  authorization_context:
    scope: ["finance"]
    ttl: 300
    is_revoked: false
    nonce: "NONCE-UNIQUE-88319"
